# Checks every implementation on each pull request and push to main. Go runs against a PostgreSQL made from typle-r's
# migrations (db/migrations, scripts/migrate-test-db.sh), as it matches typle-r's current tables. Kotlin and Rails run
# without a database: their database tests read the login of typle-r v2.60.4 (typle_session_revocations), whose table
# the current migrations drop (README.md, "実装が合わせている typle-r の版").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: typle
          POSTGRES_PASSWORD: typle
          POSTGRES_DB: typle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U typle -d typle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TYPLE_TEST_DATABASE_URL: postgres://typle:typle@localhost:5432/typle_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l server api)" || { gofmt -l server api; exit 1; }
      - run: go vet ./...
      - name: Migrate the test database
        run: scripts/migrate-test-db.sh
      - run: go test ./...

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test tests/*.test.cjs

  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          working-directory: rails
          bundler-cache: true
      - run: bin/rails test

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew test --no-daemon
