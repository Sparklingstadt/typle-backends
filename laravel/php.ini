; The PHP settings of the Docker image (on top of php.ini-production).
; No X-Powered-By header.
expose_php = Off
; $_ENV holds the environment, which config/typle.php and config/database.php read.
variables_order = "EGPCS"
; A body is read whole and refused past 1 MiB by the app (413 workspaceTooLarge), as Next.js refuses it; PHP must not
; drop a larger one first (Cloud Run takes requests of up to 32 MiB).
post_max_size = 33M
memory_limit = 256M
; The code does not change in the image.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
